# binds.conf — vim-like keybindings matching the terminal cheatsheet.
[messages]
q     = :quit<Enter>
j     = :next<Enter>
k     = :prev<Enter>
<Down>= :next<Enter>
<Up>  = :prev<Enter>
g     = :select 0<Enter>
G     = :select -1<Enter>
<C-d> = :next 50%<Enter>
<C-u> = :prev 50%<Enter>
J     = :next-folder<Enter>
K     = :prev-folder<Enter>
<Enter> = :view<Enter>
d     = :prompt 'Really delete this message?' 'delete-message'<Enter>
D     = :delete<Enter>
a     = :archive flat<Enter>
m     = :move<space>
cp    = :copy<space>
!     = :toggle-flag Seen<Enter>
*     = :toggle-flag Flagged<Enter>
v     = :mark -t<Enter>
V     = :mark -v<Enter>
T     = :toggle-threads<Enter>
/     = :search<space>
\     = :filter<space>
n     = :next-result<Enter>
N     = :prev-result<Enter>
C     = :compose<Enter>
rr    = :reply -a<Enter>
rq    = :reply -aq<Enter>
R     = :reply<Enter>
f     = :forward<Enter>
<C-p> = :prev-account<Enter>
<C-n> = :next-account<Enter>
gt    = :next-tab<Enter>
gT    = :prev-tab<Enter>

[view]
q = :close<Enter>
O = :open<Enter>
S = :save<space>
| = :pipe<space>
D = :delete<Enter>
a = :archive flat<Enter>
f = :forward<Enter>
rr = :reply -a<Enter>
R = :reply<Enter>
H = :toggle-headers<Enter>
J = :next<Enter>
K = :prev<Enter>

[compose]
$noinherit = true
$ex = <C-x>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<tab> = :next-field<Enter>

[compose::review]
y = :send<Enter>
n = :abort<Enter>
p = :postpone<Enter>
q = :abort<Enter>
e = :edit<Enter>
a = :attach<space>
