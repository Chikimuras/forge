# Yazi 26.x — note the section is [mgr]; [manager] is the old deprecated name.
# Shared between macOS and Ubuntu: openers are split with `for =` rather than
# forked into two files, so there is only one config to keep in sync.

[mgr]
ratio          = [1, 3, 4]   # parent | current | preview
sort_by        = "natural"   # file2 before file10
sort_dir_first = true
linemode       = "size"
show_hidden    = false       # toggle at runtime with .
show_symlink   = true
scrolloff      = 5

[preview]
max_width  = 1200            # generous: kitty draws real pixels, not cells
max_height = 1200
image_filter = "lanczos3"
tab_size   = 2

[opener]
edit = [
  { run = '$EDITOR "$@"', desc = "$EDITOR", block = true },
]
open = [
  { run = 'open "$@"',     desc = "Open in default app", for = "macos", orphan = true },
  { run = 'xdg-open "$@"', desc = "Open in default app", for = "linux", orphan = true },
]
reveal = [
  { run = 'open -R "$1"',                desc = "Reveal in Finder",       for = "macos", orphan = true },
  { run = 'xdg-open "$(dirname "$1")"',  desc = "Reveal enclosing folder", for = "linux", orphan = true },
]

[open]
prepend_rules = [
  # Text-ish files go to $EDITOR instead of the desktop default app.
  { url = "*.log",  use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.lock", use = "edit" },
]
