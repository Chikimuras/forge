# kitty.conf — ported to Linux/Wayland. cmd+* macOS binds remapped to ctrl/super.

# Font (forge installs JetBrainsMono Nerd Font)
font_family      JetBrainsMono Nerd Font
font_size        12.0

# Better scrolling
scrollback_lines 50000

# Copy on select and detect URLs
copy_on_select   yes
detect_urls      yes

# Hints (open files/urls)
map ctrl+shift+h kitten hints --type=hyperlink
map ctrl+shift+f kitten hints --type=path --program "${EDITOR:-nvim}"

# New window / fullscreen (cmd+* on macOS → ctrl+shift / super)
map ctrl+shift+enter new_window
map super+enter      toggle_fullscreen
map shift+enter      send_text all \e\r

# Splits
map f5 launch --location=hsplit
map f6 launch --location=vsplit
map f4 launch --location=split
map f7 layout_action rotate

# Move active window
map shift+up    move_window up
map shift+left  move_window left
map shift+right move_window right
map shift+down  move_window down

# Focus neighboring window
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

# Bias / maximize the focused split
map ctrl+. layout_action bias 80

# Wayland: let the compositor (sway) own window decorations
linux_display_server wayland
confirm_os_window_close 0
