# =============================================================================
# tmux.conf — config sensée pour workflow nvim + kitty
# Reload : prefix + r  |  ou depuis le shell : tmux source ~/.config/tmux/tmux.conf
# =============================================================================

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix          # double C-Space envoie un vrai C-Space à l'app dessous

# -----------------------------------------------------------------------------
# Bases
# -----------------------------------------------------------------------------
set -g mouse on                   # souris : scroll, select pane, resize, copy
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB"
set -sg escape-time 0             # pas de délai après Échap (crucial pour nvim)
set -g focus-events on            # nvim sait quand le pane reprend le focus
set -g allow-passthrough on       # laisse passer le protocole graphique kitty (previews d'images yazi)
set -g history-limit 50000        # scrollback généreux
set -g base-index 1               # fenêtres numérotées à partir de 1 (plus proche du clavier)
setw -g pane-base-index 1
set -g renumber-windows on        # renumérote quand on ferme une fenêtre
set -g set-titles on              # titre de la fenêtre terminale = session/fenêtre tmux
set -g status-interval 5
setw -g mode-keys vi              # copy-mode en vi (hjkl, v pour sélectionner, y pour yank)
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'kitty*:extkeys'

# -----------------------------------------------------------------------------
# Raccourcis
# -----------------------------------------------------------------------------

# Reload de la conf
bind r source-file ~/.config/tmux/tmux.conf \; display "Config rechargée 󰑮"

# Splits plus intuitifs : | = vertical, - = horizontal, dans le même cwd
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Nouvelle fenêtre dans le même cwd
bind c new-window -c "#{pane_current_path}"

# Navigation entre panes : hjkl (sans prefix grâce à vim-tmux-navigator plus bas)
# Resize avec prefix + HJKL (majuscules, répétable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Switch rapide entre les 2 dernières fenêtres
bind Space last-window

# Synchronisation des panes (taper la même chose partout)
bind S setw synchronize-panes \; display "Sync panes : #{?pane_synchronized,ON,OFF}"

# Copy-mode façon vim
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
# Souris : drag pour sélectionner, relâcher copie vers le clipboard système
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Kill pane / window sans confirmation pénible
bind x kill-pane
bind X kill-window

# -----------------------------------------------------------------------------
# Statusbar (sobre, infos utiles)
# -----------------------------------------------------------------------------
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left  "#[fg=green,bold] #S #[fg=white,nobold]│ "
set -g status-right "#[fg=cyan]#(whoami)@#h #[fg=white]│ #[fg=yellow]%a %d %b #[fg=white]│ #[fg=magenta]%H:%M "
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=black,bg=green,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"

# -----------------------------------------------------------------------------
# Plugins (TPM)
# Install : prefix + I  |  Update : prefix + U  |  Remove unused : prefix + alt-u
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l navigue nvim ⇄ tmux
set -g @plugin 'tmux-plugins/tmux-yank'           # y dans copy-mode → clipboard système

# Doit rester en toute fin de fichier
run '~/.config/tmux/plugins/tpm/tpm'
