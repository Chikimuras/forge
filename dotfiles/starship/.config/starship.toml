# starship.toml — info-dense prompt mirroring the old oh-my-zsh feel.
# Requires a Nerd Font (forge installs JetBrainsMono Nerd Font).

add_newline = true
command_timeout = 800

format = """
$directory\
$git_branch\
$git_status\
$nodejs$python$ruby$rust$golang$java\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
stashed = "*${count}"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "yellow"

[nodejs]
symbol = " "
[python]
symbol = " "
[ruby]
symbol = " "
[rust]
symbol = " "
[golang]
symbol = " "
[java]
symbol = " "
[docker_context]
symbol = " "
