name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: |
          find . -type f \( -name '*.sh' -o -path './bootstrap.sh' \) \
            -not -path './dotfiles/*' -print0 \
          | xargs -0 shellcheck -S warning -x

  smoke:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y sudo curl wget gnupg lsb-release git stow ca-certificates
          # create a non-root user (bootstrap refuses to run as root)
          useradd -m -s /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          cp -r . /home/tester/forge
          chown -R tester:tester /home/tester/forge
      - name: Dry-run bootstrap (headless, no security)
        run: |
          su tester -c 'cd ~/forge && ./bootstrap.sh --dry-run --yes --no-desktop --no-security'
      - name: Validate stow packages link cleanly (zsh/git/tmux)
        run: |
          su tester -c 'cd ~/forge && stow --no --target=$HOME --dir dotfiles zsh git tmux 2>&1 | tee /tmp/stow.log; ! grep -i conflict /tmp/stow.log'
